[pytest]
pythonpath = src scripts
testpaths = tests
markers =
    live: gọi Gemini API thật (bỏ qua mặc định; chạy bằng: pytest -m live với MSA_GEMINI_KEY_FILE)
    realdata: cần dữ liệu thật trong $MSA_SHARED_DATA (mặc định /home/claude/work/shared_data; tự bỏ qua nếu thiếu)
addopts = -m "not live"
