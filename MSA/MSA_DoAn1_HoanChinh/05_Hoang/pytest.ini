[pytest]
pythonpath = src ../src
testpaths = tests
markers =
    live: gọi Gemini/ dữ liệu thật qua mạng – bỏ qua mặc định, chạy bằng `pytest -m live`
    realdata: cần catalog thật trong data/processed (chạy được trên máy nhóm sau khi chạy scripts 01/01b/02)
addopts = -m "not live"
filterwarnings =
    ignore::DeprecationWarning
