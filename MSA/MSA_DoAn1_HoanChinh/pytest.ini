[pytest]
# Test tích hợp của package msa chung (src/msa). Test riêng của từng thành viên chạy trong folder của họ.
testpaths = tests
pythonpath = src
markers =
    live: gọi Gemini API thật (tốn quota) – bỏ qua mặc định, chạy bằng: pytest -m live
    realdata: cần index DINOv2-S + shared_data thật (MSA_SHARED_DATA); tự bỏ qua nếu thiếu
addopts = -m "not live"
filterwarnings =
    ignore::DeprecationWarning
